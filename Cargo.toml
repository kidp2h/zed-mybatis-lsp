[package]
name = "mybatis-lsp"
version = "0.1.0"
edition = "2021"
description = "MyBatis Mapper XML navigation language server for Zed"
license = "MIT"

[dependencies]
async-trait = "0.1"
regex = "1"
serde_json = "1"
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread", "sync"] }
tower-lsp = "0.20"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
