name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            asset: mybatis-lsp-darwin-aarch64
          - os: macos-13
            target: x86_64-apple-darwin
            asset: mybatis-lsp-darwin-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: mybatis-lsp-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: mybatis-lsp-linux-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: mybatis-lsp-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - if: runner.os == 'Windows'
        shell: bash
        run: cp target/${{ matrix.target }}/release/mybatis-lsp.exe ${{ matrix.asset }}
      - if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/mybatis-lsp ${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
